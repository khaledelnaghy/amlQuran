name: aml
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  animated_text_kit: ^4.2.3
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  gap: ^3.0.1
  go_router: ^14.7.2
  introduction_screen: ^3.1.14
  shared_preferences: ^2.5.1

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/icons/
  fonts:
    - family: Janna LT Bold
      fonts:
        - asset: assets/fonts/Janna LT Bold.ttf
